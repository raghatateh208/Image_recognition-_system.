<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Recognition System</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h2 {
            margin-bottom: 24px;
            color: var(--primary);
            font-size: 24px;
        }

        .upload-box {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            margin-bottom: 20px;
        }

        .upload-box:hover {
            border-color: var(--primary);
            background-color: #f1f5f9;
        }

        input[type="file"] {
            display: none;
        }

        .preview-container {
            margin-top: 15px;
            display: none;
        }

        #imagePreview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            object-fit: contain;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #result {
            margin-top: 25px;
            text-align: left;
        }

        .prediction-item {
            background: #f1f5f9;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
        }

        .confidence {
            background: var(--primary);
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
        }

        .loader {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>AI Image Recognition</h2>
        
        <label for="imageInput" class="upload-box" id="dropZone">
            <span id="uploadText">📁 Click here to select an image</span>
            <input type="file" id="imageInput" accept="image/*" onchange="previewFile()">
        </label>

        <div class="preview-container" id="previewBox">
            <img id="imagePreview" src="#" alt="Preview">
        </div>

        <button onclick="uploadImage()">Analyze Image</button>

        <div class="loader" id="loadingSpinner"></div>
        <div id="result"></div>
    </div>

    <script>
        function previewFile() {
            const preview = document.getElementById('imagePreview');
            const fileInput = document.getElementById('imageInput');
            const previewBox = document.getElementById('previewBox');
            const uploadText = document.getElementById('uploadText');

            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    previewBox.style.display = 'block';
                    uploadText.innerText = "Change Image";
                }
                reader.readAsDataURL(file);
            }
        }

        async function uploadImage() {
            const input = document.getElementById('imageInput');
            const resultDiv = document.getElementById('result');
            const spinner = document.getElementById('loadingSpinner');

            if (input.files.length === 0) {
                alert("Please select an image first!");
                return;
            }

            const formData = new FormData();
            formData.append("file", input.files[0]);

            resultDiv.innerHTML = "";
            spinner.style.display = 'block';

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                spinner.style.display = 'none';
                let output = "<h3 style='font-size: 16px; margin-bottom: 12px;'>Predictions:</h3>";
                
                data.predictions.forEach(p => {
                    output += `
                        <div class="prediction-item">
                            <span>${p.label}</span>
                            <span class="confidence">${p.confidence.toFixed(2)}%</span>
                        </div>
                    `;
                });
                resultDiv.innerHTML = output;
            } catch (error) {
                spinner.style.display = 'none';
                resultDiv.innerHTML = "<p style='color: red;'>Error occurred during prediction.</p>";
            }
        }
    </script>
</body>
</html>
